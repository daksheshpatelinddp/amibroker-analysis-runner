# One analysis job (Optimize, Walk-Forward, Scan, Explore or Backtest) split over several machines. Started by the app (workflow_dispatch with the job id).
# Optimize / Walk-Forward: the combinations are shared out. Scan / Explore: the symbols are shared out (one machine per 100 symbols at most).
# Backtest: one machine (a portfolio backtest needs all symbols together).
# A run lasts at most about 6 hours; a job that needs longer saves its progress and the last step starts the next run by itself.
# Market data: downloaded ONCE per data version (R2, or a GitHub Release when the variable DATA_RELEASE_URL is set) and kept in the
# Actions cache. All machines read that copy, so the data host gets a handful of requests per run, not thousands.
name: analysis
on:
  workflow_dispatch:
    inputs:
      job:
        description: 'Job id (the folder jobs/<id>/ written by the app)'
        required: true
permissions:
  contents: write
  actions: write
env:
  ENGINE_DIR: engine
  DATA_DIR: data
  DATA_RELEASE_URL: ${{ vars.DATA_RELEASE_URL }}
  GITHUB_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  BRANCH: ${{ github.ref_name }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
      datakey: ${{ steps.k.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.ENGINE_REPO }}
          token: ${{ secrets.ENGINE_TOKEN || github.token }}
          path: engine
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: p
        run: node --import ./src/register.mjs src/cli.mjs plan "${{ inputs.job }}"
      - id: k
        run: node --import ./src/register.mjs src/cli.mjs datakey "${{ inputs.job }}"
      - uses: actions/cache@v4
        with:
          path: data
          key: ${{ steps.k.outputs.key }}
      - run: node --import ./src/register.mjs src/cli.mjs sync "${{ inputs.job }}"
  shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.ENGINE_REPO }}
          token: ${{ secrets.ENGINE_TOKEN || github.token }}
          path: engine
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: ${{ needs.plan.outputs.datakey }}
      - run: node --max-old-space-size=6000 --import ./src/register.mjs src/cli.mjs shard "${{ inputs.job }}" ${{ matrix.shard }}
        env: { DEADLINE_MIN: '335' }
  merge:
    needs: [plan, shard]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.ENGINE_REPO }}
          token: ${{ secrets.ENGINE_TOKEN || github.token }}
          path: engine
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: ${{ needs.plan.outputs.datakey }}
      - run: node --max-old-space-size=6000 --import ./src/register.mjs src/cli.mjs merge "${{ inputs.job }}"
